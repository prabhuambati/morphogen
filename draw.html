<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>DRAW BOT — Morphogen</title>
<style>
:root{font-family:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color:#000;background:#fff;font-size:12px}
*{box-sizing:border-box;border-radius:0}
body{margin:0;min-height:100vh;overflow:hidden;background:#fff}
button,input,select{font:inherit;color:inherit}
button,select,input[type=number],input[type=text],input[type=file]{min-height:40px;border:2px solid #000;background:#fff;padding:7px;box-shadow:2px 2px 0 #000}
button{font-weight:700;cursor:pointer;letter-spacing:.025em}
button:hover{background:#000;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
input[type=range]{width:100%;height:28px;accent-color:#000}
input[type=color]{width:44px;height:40px;padding:2px;border:2px solid #000;background:#fff}
input[type=checkbox]{width:18px;height:18px;accent-color:#000}
select{width:100%;font-weight:700}
header{height:54px;border-bottom:2px solid #000;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;gap:12px;background:#fff}
.brand{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}.brand small{font-size:10px}
.top-tools{display:flex;gap:8px;align-items:center}.top-tools button{min-height:40px}
.app{height:calc(100vh - 54px);min-height:0;display:grid;grid-template-columns:260px minmax(300px,1fr) 260px;gap:12px;padding:12px}
.side{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.card{border:2px solid #000;box-shadow:4px 4px 0 #000;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0 0 2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid #000;padding-bottom:7px}
.field{display:flex;flex-direction:column;gap:3px}.field label,.label{font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:7px;align-items:center}.row>*{flex:1;min-width:0}.row button{min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.seg button{padding:5px 3px;font-size:10px;min-height:40px}.seg button.active{background:#000;color:#fff}
.check{display:flex;align-items:center;gap:7px;min-height:36px;font-weight:700;font-size:10px}
.thumb{display:block;width:100%;height:70px;object-fit:contain;background:#f4f1e8;border:1px solid #000}
.mini-thumb{width:100%;max-height:130px;object-fit:contain;background:#f4f1e8;border:1px solid #000}
.empty-thumb{height:64px;border:1px dashed #000;display:grid;place-items:center;color:#666;font-size:10px}
.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#eee;border:2px solid #000;box-shadow:4px 4px 0 #000}
.board-wrap{position:relative;width:min(100%,calc(100vh - 100px));height:min(100%,calc(100vh - 100px));aspect-ratio:1/1;display:grid;place-items:center}
.board{position:relative;width:100%;height:100%;overflow:hidden;border:2px solid #000;background:#f5f0df}
.board canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s ease}
#ghostCanvas{pointer-events:none}#inkCanvas{display:block}#penCanvas{pointer-events:none}
#gridCanvas{display:block;opacity:0;pointer-events:none}
.stage.grid-view #inkCanvas,.stage.grid-view #ghostCanvas,.stage.grid-view #penCanvas{opacity:0}
.stage.grid-view #gridCanvas{opacity:1}
.stage.analyzing::after{content:"ANALYZING…";position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000;padding:14px;font-weight:700;letter-spacing:.1em}
.stage.dragover{outline:5px solid #000;outline-offset:-10px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{background:#000;color:#fff;min-height:50px;box-shadow:4px 4px 0 #000;letter-spacing:.07em}
.primary:hover{background:#fff;color:#000}
.full{width:100%}.status{border:2px solid #000;padding:8px;font-weight:700;font-size:10px;min-height:36px}.stats{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:10px}.stats b{text-align:right}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.swatch{width:100%;height:auto;min-height:40px;aspect-ratio:1;border:2px solid #000;box-shadow:2px 2px 0 #000}
.tiny{font-size:9px;color:#444;line-height:1.45}
.grid-preview-wrap{border:2px solid #000;min-height:90px;background:#f5f0df;display:grid;place-items:center}.grid-preview-wrap canvas{max-width:100%;max-height:180px;image-rendering:pixelated}
.badge{font-size:9px;font-weight:700}
.hidden-ui header,.hidden-ui .side,.hidden-ui .top-tools{display:none!important}
.hidden-ui .app{height:100vh;display:block;padding:0}
.hidden-ui .stage{height:100vh;border:0;box-shadow:none;background:#fff}
.hidden-ui .board-wrap{width:min(100vw,100vh);height:min(100vh,100vw)}
.hidden-ui .board{border:0}
.toast{position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;box-shadow:4px 4px 0 #999;display:none;font-weight:700}
@media(max-width:1139px){
 body{overflow:auto}.app{height:auto;min-height:calc(100vh - 54px);grid-template-columns:1fr;padding:12px}
 .stage{grid-row:1;height:min(70vh,680px);min-height:340px}
 .board-wrap{width:min(100%,calc(70vh - 30px));height:min(100%,calc(70vh - 30px))}
 .side{overflow:visible;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-content:start}
 .right{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
 .hidden-ui .app{height:100vh}.hidden-ui .stage{height:100vh}
}
@media(max-width:560px){header{height:50px}.app{padding:8px;gap:10px}.stage{min-height:300px;height:52vh}.board-wrap{width:min(100%,48vh);height:min(100%,48vh)}.top-tools{gap:4px}.top-tools button{padding:5px;font-size:9px}}
</style>
</head>
<body>
<header>
 <div class="brand">DRAW BOT <small>· MORPHOGEN</small></div>
 <div class="top-tools"><button id="hideBtn" type="button">HIDE UI · H</button><button id="recordTop" type="button">● RECORD</button></div>
</header>
<main class="app">
 <aside class="side left">
  <section class="card">
   <h2>SOURCE</h2>
   <div class="field"><label for="fileInput">Image file</label><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp"></div>
   <img id="sourceThumb" class="thumb" alt="Source image preview" hidden>
   <div id="sourceEmpty" class="empty-thumb">DROP IMAGE ANYWHERE</div>
   <div class="tiny">All processing stays in this page.</div>
  </section>
  <section class="card">
   <h2>TRACE</h2>
   <div class="field"><label for="smooth">Smoothing <output id="smoothOut">2</output></label><input id="smooth" type="range" min="0" max="6" value="2"></div>
   <div class="field"><label for="detail">Detail <output id="detailOut">50%</output></label><input id="detail" type="range" min="0" max="100" value="50"></div>
   <div class="field"><label for="minLength">Min length <output id="minLengthOut">8 px</output></label><input id="minLength" type="range" min="2" max="60" value="8"></div>
   <div class="field"><label for="strokeOrder">Stroke order</label><select id="strokeOrder"><option value="importance">IMPORTANCE</option><option value="top">TOP TO BOTTOM</option><option value="nearest">NEAREST</option></select></div>
   <label class="check"><input id="shading" type="checkbox" checked> SHADING PASS</label>
   <div class="field"><label for="hatchSpacing">Hatch spacing <output id="hatchSpacingOut">7 px</output></label><input id="hatchSpacing" type="range" min="3" max="12" value="7"></div>
   <div class="field"><label for="hatchDensity">Hatch density <output id="hatchDensityOut">55%</output></label><input id="hatchDensity" type="range" min="0" max="100" value="55"></div>
  </section>
  <section class="card">
   <h2>PEN</h2>
   <div class="field"><label for="inkColor">Ink</label><div class="row"><select id="inkPreset"><option value="#111111">BLACK</option><option value="#80552f">SEPIA</option><option value="#164b88">BLUE</option><option value="custom">CUSTOM</option></select><input id="inkColor" type="color" value="#111111" aria-label="Custom ink color"></div></div>
   <div class="field"><label for="lineWidth">Line width <output id="lineWidthOut">2 px</output></label><input id="lineWidth" type="range" min="1" max="5" value="2"></div>
   <div class="field"><label>Style</label><div id="penStyle" class="seg"><button class="active" data-v="clean">CLEAN</button><button data-v="pencil">PENCIL</button><button data-v="marker">MARKER</button></div></div>
  </section>
  <section class="card">
   <h2>ROBOT</h2>
   <div class="field"><label for="speed">Speed · pts/frame <output id="speedOut">25</output></label><input id="speed" type="range" min="1" max="200" value="25"></div>
   <div class="field"><label for="cursorType">Cursor</label><select id="cursorType"><option>ROBOT</option><option>PENCIL</option><option>DOT</option><option>NONE</option></select></div>
   <label class="check"><input id="arm" type="checkbox" checked> ARM ON</label>
   <label class="check"><input id="travel" type="checkbox"> SHOW TRAVEL</label>
   <label class="check"><input id="easing" type="checkbox" checked> EASING</label>
   <label class="check"><input id="ghostOn" type="checkbox"> BACKGROUND SKETCH</label>
   <div class="field"><label for="ghostRef">Ghost reference <output id="ghostRefOut">0%</output></label><input id="ghostRef" type="range" min="0" max="40" value="0"></div>
   <div class="field"><label for="liftPause">Pen lift <output id="liftPauseOut">40 ms</output></label><input id="liftPause" type="range" min="0" max="200" step="10" value="40"></div>
  </section>
  <button id="startBtn" class="primary full" type="button">▶ START DRAWING</button>
  <div class="side-actions"><button id="stopBtn" type="button">■ STOP</button><button id="clearBtn" type="button">↺ CLEAR</button></div>
 </aside>
 <section id="stage" class="stage">
  <div class="board-wrap"><div id="board" class="board">
   <canvas id="ghostCanvas"></canvas><canvas id="inkCanvas"></canvas><canvas id="gridCanvas"></canvas><canvas id="penCanvas"></canvas>
  </div></div>
 </section>
 <aside class="side right">
  <section class="card"><h2>PREVIEW</h2><img id="previewThumb" class="mini-thumb" alt="Original image preview" hidden><div id="previewEmpty" class="empty-thumb">ORIGINAL IMAGE</div></section>
  <section class="card">
   <h2>STATS</h2><div id="drawStatus" class="status">LOAD AN IMAGE TO BEGIN</div>
   <div class="stats"><span>Strokes</span><b id="strokeStat">0 / 0</b><span>Points</span><b id="pointStat">0 / 0</b><span>Drawn</span><b id="percentStat">0%</b><span>ETA</span><b id="etaStat">—</b></div>
   <div id="analysisStat" class="tiny"></div>
  </section>
  <section class="card">
   <h2>RECORD</h2>
   <div class="row"><select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select><select id="quality"><option value="0.8">HIGH</option><option value="0.55">MEDIUM</option><option value="0.3">LOW</option></select></div>
   <label class="check"><input id="watermark" type="checkbox"> SHOW WATERMARK</label>
   <input id="watermarkText" type="text" value="morphogen.space" aria-label="Watermark text">
   <div class="row"><button id="recordBtn" type="button">● RECORD</button><button id="downloadVideo" type="button" disabled>↓ VIDEO</button></div>
   <div id="recordStatus" class="tiny">Canvas only · no audio</div>
  </section>
  <section class="card">
   <h2>EXPORT</h2><button id="exportDrawing" type="button">↓ PNG · DRAWING</button>
  </section>
  <section class="card">
   <h2>TO GRID</h2>
   <div class="field"><label for="gridRows">Grid size</label><select id="gridRows"><option>64</option><option>96</option><option selected>128</option><option>192</option><option>256</option></select></div>
   <div class="field"><label for="threshold">Ink threshold <output id="thresholdOut">18%</output></label><input id="threshold" type="range" min="5" max="60" value="18"></div>
   <button id="convertGrid" type="button">CONVERT TO INK GRID</button>
   <div class="grid-preview-wrap"><canvas id="gridPreview" width="160" height="100"></canvas></div>
   <div class="row"><button id="exportGridJson" disabled>↓ GRID JSON</button><button id="copyGrid" disabled>COPY GRID DATA</button></div>
   <button id="exportGridPng" disabled>↓ GRID PNG</button>
   <hr style="width:100%;border:0;border-top:2px solid #000">
   <div class="field"><label for="lifeRule">Growth rule</label><select id="lifeRule"><option value="B3/S23">LIFE · B3/S23</option><option value="B36/S23">HIGHLIFE · B36/S23</option></select></div>
   <div class="palette" id="palette"></div>
   <div class="field"><label for="palettePreset">Palette preset</label><select id="palettePreset"><option>RANGOLI</option><option>NEON NIGHT</option><option>CORAL REEF</option><option>SUNSET</option></select></div>
   <div class="field"><label for="ghostFade">Ghost fade <output id="ghostFadeOut">12%</output></label><input id="ghostFade" type="range" min="0" max="40" value="12"></div>
   <div class="field"><label for="growSpeed">Growth speed <output id="growSpeedOut">8 fps</output></label><input id="growSpeed" type="range" min="1" max="30" value="8"></div>
   <button id="growBtn" class="primary" disabled>▶ GROW</button>
   <button id="backDraw" disabled>↺ BACK TO DRAWING</button>
  </section>
 </aside>
</main>
<div id="toast" class="toast"></div>
<script>
'use strict';
(()=>{
const $=s=>document.querySelector(s), stage=$('#stage'),board=$('#board');
const ghostCanvas=$('#ghostCanvas'),inkCanvas=$('#inkCanvas'),penCanvas=$('#penCanvas'),gridCanvas=$('#gridCanvas');
const ghostCtx=ghostCanvas.getContext('2d',{alpha:true}),inkCtx=inkCanvas.getContext('2d'),penCtx=penCanvas.getContext('2d',{alpha:true}),gridCtx=gridCanvas.getContext('2d');
const paletteSets={
 'RANGOLI':['#ff6f61','#ffa69e','#00a8a8','#f4e285','#5c2a9d','#2a9d8f','#f28482','#e9c46a'],
 'NEON NIGHT':['#ff00e5','#00f0ff','#b5ff00','#ff6b00','#7a00ff','#ff3cac','#00ff9c','#ffff00'],
 'CORAL REEF':['#ff6f61','#ffa69e','#00a8a8','#f4e285','#5c2a9d','#2a9d8f','#ff6f61','#ffa69e'],
 'SUNSET':['#3d405b','#e07a5f','#f2cc8f','#81b29a','#f4f1de','#bc4749','#e07a5f','#f2cc8f']
};
let palette=paletteSets.RANGOLI.slice(), sourceImage=null,sourceCanvas=null,sourceW=0,sourceH=0,workingW=0,workingH=0;
let gray=null,blurred=null,gradient=null,strokes=[],strokeCount=0,totalPoints=0,drawnPoints=0,drawnStrokeCount=0;
let running=false,analysisBusy=false,raf=0,currentStroke=0,currentPoint=0,penX=0,penY=0,lastFrame=0,strokePauseUntil=0,traveling=false,travelX=0,travelY=0;
let viewScale=1,viewOffsetX=0,viewOffsetY=0,dpr=1,style='clean',strokeStartTime=0,elapsedDraw=0,lastStatTime=0;
let seedBase=0x5eed1234,grid=null,growthTimer=0,growthRunning=false,recorder=null,recordChunks=[],recordCanvas=null,recordCtx=null,recordStream=null,recordFrame=0,recordMime='';
let previousView='draw',finishAnim=null,toastTimer=0,analysisDirty=false,analysisTimer=0,analysisPending=false,growthStarted=false,viewTransition=null,recordWatermarkFont='',travelDash=[5,5];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(text){const t=$('#toast');t.textContent=text;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2300)}
function setStatus(text){$('#drawStatus').textContent=text}
function setOutput(id,text){$('#'+id).textContent=text}
function updateRangeOutputs(){
 setOutput('smoothOut',$('#smooth').value);setOutput('detailOut',$('#detail').value+'%');setOutput('minLengthOut',$('#minLength').value+' px');
 setOutput('hatchSpacingOut',$('#hatchSpacing').value+' px');setOutput('hatchDensityOut',$('#hatchDensity').value+'%');
 setOutput('lineWidthOut',$('#lineWidth').value+' px');setOutput('speedOut',$('#speed').value);
 setOutput('ghostRefOut',$('#ghostRef').value+'%');setOutput('liftPauseOut',$('#liftPause').value+' ms');
 setOutput('thresholdOut',$('#threshold').value+'%');setOutput('ghostFadeOut',$('#ghostFade').value+'%');setOutput('growSpeedOut',$('#growSpeed').value+' fps');
}
function resizeCanvases(){
 const rect=board.getBoundingClientRect();if(!rect.width||!rect.height)return;
 dpr=Math.min(2,window.devicePixelRatio||1);
 travelDash[0]=travelDash[1]=5*dpr;
 const oldInk=document.createElement('canvas');oldInk.width=inkCanvas.width;oldInk.height=inkCanvas.height;
 if(oldInk.width&&oldInk.height)oldInk.getContext('2d').drawImage(inkCanvas,0,0);
 for(const c of [ghostCanvas,inkCanvas,penCanvas,gridCanvas]){const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h}}
 if(sourceImage){drawBackground();if(oldInk.width&&oldInk.height&&drawnPoints)inkCtx.drawImage(oldInk,0,0,inkCanvas.width,inkCanvas.height);if(totalPoints&&drawnPoints===0)renderGhost();if(grid)renderGridCanvas()}
 renderPen();
}
function drawBackground(){
 inkCtx.setTransform(1,0,0,1,0,0);inkCtx.clearRect(0,0,inkCanvas.width,inkCanvas.height);
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);penCtx.clearRect(0,0,penCanvas.width,penCanvas.height);
 if(!sourceImage)return;
 const pad=16*dpr,fit=Math.min((inkCanvas.width-2*pad)/sourceW,(inkCanvas.height-2*pad)/sourceH);
 viewScale=fit;viewOffsetX=(inkCanvas.width-sourceW*viewScale)/2;viewOffsetY=(inkCanvas.height-sourceH*viewScale)/2;
 renderGhost();
}
function renderGhost(){
 ghostCtx.clearRect(0,0,ghostCanvas.width,ghostCanvas.height);
 if(!sourceImage||!$('#ghostOn').checked||+$('#ghostRef').value===0)return;
 ghostCtx.save();ghostCtx.globalAlpha=+$('#ghostRef').value/100;ghostCtx.imageSmoothingEnabled=true;
 ghostCtx.drawImage(sourceImage,viewOffsetX,viewOffsetY,sourceW*viewScale,sourceH*viewScale);ghostCtx.restore();
}
function drawImageThumb(src){
 for(const id of ['sourceThumb','previewThumb']){const el=$('#'+id);el.src=src;el.hidden=false}
 $('#sourceEmpty').hidden=true;$('#previewEmpty').hidden=true;
}
async function loadFile(file){
 if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){toast('Choose a PNG, JPG or WEBP image');return}
 if(analysisBusy){toast('Wait for the current analysis to finish');return}
 try{
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Could not read this image'));img.src=url});
  if(analysisBusy){URL.revokeObjectURL(url);toast('Wait for the current analysis to finish');return}
  sourceImage=img;
  if(sourceCanvas)sourceCanvas.width=sourceCanvas.height=1;
  sourceCanvas=document.createElement('canvas');
  sourceW=img.naturalWidth;sourceH=img.naturalHeight;
  const scale=Math.min(1,700/Math.max(sourceW,sourceH));
  workingW=Math.max(1,Math.round(sourceW*scale));workingH=Math.max(1,Math.round(sourceH*scale));
  sourceW=workingW;sourceH=workingH;
  sourceCanvas.width=workingW;sourceCanvas.height=workingH;
  const cx=sourceCanvas.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,workingW,workingH);
  drawImageThumb(sourceCanvas.toDataURL('image/png'));
  URL.revokeObjectURL(url);resizeCanvases();await analyze();
 }catch(err){console.error(err);setStatus('IMAGE LOAD FAILED');toast(err.message||'Image could not be loaded')}
}
async function yieldFrame(){await new Promise(resolve=>requestAnimationFrame(()=>resolve()))}
function gaussianKernel(radius){
 const sigma=Math.max(.5,radius*.65),r=Math.ceil(radius),k=new Float32Array(r*2+1);let sum=0;
 for(let i=-r;i<=r;i++){const v=Math.exp(-(i*i)/(2*sigma*sigma));k[i+r]=v;sum+=v}
 for(let i=0;i<k.length;i++)k[i]/=sum;return {k,r};
}
async function analyze(){
 if(!sourceCanvas)return;
 clearTimeout(analysisTimer);analysisDirty=false;analysisBusy=true;running=false;growthRunning=false;cancelAnimationFrame(growthTimer);cancelAnimationFrame(raf);$('#startBtn').disabled=true;$('#convertGrid').disabled=true;$('#startBtn').textContent='▶ START DRAWING';$('#growBtn').disabled=$('#exportGridJson').disabled=$('#exportGridPng').disabled=$('#copyGrid').disabled=$('#backDraw').disabled=true;stage.classList.add('analyzing');setStatus('ANALYZING…');$('#analysisStat').textContent='Building edge map and tracing contours…';
 strokes=[];strokeCount=totalPoints=drawnPoints=drawnStrokeCount=0;currentStroke=currentPoint=0;grid=null;stage.classList.remove('grid-view');
 const started=performance.now(),w=workingW,h=workingH,n=w*h;
 try{
  const ctx=sourceCanvas.getContext('2d',{willReadFrequently:true}),pixels=ctx.getImageData(0,0,w,h).data;
  gray=new Float32Array(n);blurred=new Float32Array(n);
  for(let i=0;i<n;i++){gray[i]=.2126*pixels[i*4]+.7152*pixels[i*4+1]+.0722*pixels[i*4+2];if((i&131071)===0)await yieldFrame()}
  const radius=+$('#smooth').value;
  if(radius){
   const {k,r}=gaussianKernel(radius),tmp=new Float32Array(n);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let j=-r;j<=r;j++)v+=gray[y*w+clamp(x+j,0,w-1)]*k[j+r];tmp[y*w+x]=v;if(((y*w+x)&131071)===0)await yieldFrame()}
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let j=-r;j<=r;j++)v+=tmp[clamp(y+j,0,h-1)*w+x]*k[j+r];blurred[y*w+x]=v;if(((y*w+x)&131071)===0)await yieldFrame()}
  }else blurred.set(gray);
  const gx=new Float32Array(n),gy=new Float32Array(n);gradient=new Float32Array(n);
  let maxMag=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
   const i=y*w+x;

  recordCanvas=document.createElement('canvas');recordCanvas.width=w;recordCanvas.height=h;recordCtx=recordCanvas.getContext('2d');
  recordWatermarkFont=`bold ${Math.max(12,recordCanvas.width*.018)}px monospace`;
  const fps=+$('#fps').value;recordStream=recordCanvas.captureStream(fps);recordMime=getMime();
  const options={videoBitsPerSecond:Math.round(5e6*+$('#quality').value)};if(recordMime)options.mimeType=recordMime;
  recorder=new MediaRecorder(recordStream,options);
  recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};
  recorder.onstop=()=>{$('#downloadVideo').disabled=!recordChunks.length;$('#recordStatus').textContent=`Ready · ${recordMime||'browser default'}`;recordStream.getTracks().forEach(t=>t.stop());recordFrame=0};
  recorder.start(250);$('#recordBtn').textContent='■ STOP RECORDING';$('#recordTop').textContent='■ RECORDING';$('#recordStatus').textContent=`Recording ${fps} FPS · canvas only`;
  drawRecordingFrame();recordFrame=requestAnimationFrame(recordLoop)
 }catch(err){console.error(err);toast('Could not start recording');}
}
function recordLoop(){if(!recording())return;drawRecordingFrame();recordFrame=requestAnimationFrame(recordLoop)}
function stopRecord(){
 if(!recorder||recorder.state!=='recording')return;recorder.stop();cancelAnimationFrame(recordFrame);$('#recordBtn').textContent='● RECORD';$('#recordTop').textContent='● RECORD'
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportDrawing(){
 const c=document.createElement('canvas');c.width=inkCanvas.width;c.height=inkCanvas.height;const x=c.getContext('2d');x.fillStyle='#f5f0df';x.fillRect(0,0,c.width,c.height);
 if($('#ghostOn').checked&&+$('#ghostRef').value>0)x.drawImage(ghostCanvas,0,0);x.drawImage(inkCanvas,0,0);c.toBlob(blob=>blob&&downloadBlob(blob,'draw-bot.png'),'image/png')
}
function convertGrid(){
 if(analysisBusy||analysisDirty){toast('Wait for analysis to finish');return}
 if(!sourceImage){toast('Load an image first');return}
 stopDrawing();const rows=+$('#gridRows').value,cols=Math.max(1,Math.round(rows*sourceW/sourceH)),cells=new Uint8Array(rows*cols),regions=new Uint8Array(rows*cols),locked=new Uint8Array(rows*cols),fade=new Float32Array(rows*cols),age=new Uint16Array(rows*cols);
 const img=inkCtx.getImageData(0,0,inkCanvas.width,inkCanvas.height),data=img.data,w=inkCanvas.width,h=inkCanvas.height,threshold=+$('#threshold').value/100;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x0=Math.floor(viewOffsetX+c*sourceW*viewScale/cols),x1=Math.max(x0+1,Math.floor(viewOffsetX+(c+1)*sourceW*viewScale/cols)),y0=Math.floor(viewOffsetY+r*sourceH*viewScale/rows),y1=Math.max(y0+1,Math.floor(viewOffsetY+(r+1)*sourceH*viewScale/rows));
  let sum=0,n=0;for(let y=y0;y<Math.min(h,y1);y++)for(let x=x0;x<Math.min(w,x1);x++){const p=(y*w+x)*4,a=data[p+3]/255,l=(.2126*data[p]+.7152*data[p+1]+.0722*data[p+2])*a+(.2126*245+.7152*240+.0722*223)*(1-a);sum+=255-l;n++}
  const i=r*cols+c;if(n&&sum/n/255>=threshold){cells[i]=1;locked[i]=1;fade[i]=1;regions[i]=0}
 }
 grid={rows,cols,cells,regions,locked,fade,age,nextCells:new Uint8Array(rows*cols),nextRegions:new Uint8Array(rows*cols),nextFade:new Float32Array(rows*cols),nextAge:new Uint16Array(rows*cols),bg:'#f5f0df',history:null};growthStarted=false;renderGridPreview();renderGridCanvas();viewTransition={from:'draw',start:performance.now()};stage.classList.add('grid-view');$('#growBtn').disabled=false;$('#backDraw').disabled=false;$('#exportGridJson').disabled=$('#exportGridPng').disabled=$('#copyGrid').disabled=false;setStatus(`INK GRID READY · ${cols}×${rows}`)
}
function renderGridPreview(){
 if(!grid)return;const c=$('#gridPreview'),ctx=c.getContext('2d'),scale=Math.min(c.width/grid.cols,c.height/grid.rows),w=Math.max(1,Math.floor(grid.cols*scale)),h=Math.max(1,Math.floor(grid.rows*scale)),ox=(c.width-w)/2,oy=(c.height-h)/2;
 ctx.fillStyle=grid.bg;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#111';for(let i=0;i<grid.cells.length;i++)if(grid.cells[i])ctx.fillRect(ox+(i%grid.cols)*scale,oy+Math.floor(i/grid.cols)*scale,Math.max(1,scale),Math.max(1,scale))
}
function renderGridCanvas(){
 if(!grid)return;const ctx=gridCtx,w=gridCanvas.width,h=gridCanvas.height;ctx.fillStyle=grid.bg;ctx.fillRect(0,0,w,h);
 const scale=Math.min(w/grid.cols,h/grid.rows),cw=w/grid.cols,ch=h/grid.rows,ox=(w-grid.cols*scale)/2,oy=(h-grid.rows*scale)/2;
 for(let i=0;i<grid.cells.length;i++)if(grid.cells[i]||grid.fade[i]>0){const r=(i/grid.cols)|0,c=i%grid.cols;ctx.globalAlpha=grid.cells[i]?1:grid.fade[i];ctx.fillStyle=grid.regions[i]?palette[(grid.regions[i]-1)%palette.length]:'#111';ctx.fillRect(ox+c*scale,oy+r*scale,Math.ceil(scale),Math.ceil(scale))}
 ctx.globalAlpha=1
}
function rowRle(arr,start,len){const out=[];let current=arr[start],count=0;for(let i=0;i<len;i++){const v=arr[start+i];if(v===current)count++;else{out.push([current,count]);current=v;count=1}}out.push([current,count]);return out}
function gridJson(){const rows=[];for(let r=0;r<grid.rows;r++)rows.push(rowRle(grid.cells,r*grid.cols,grid.cols));return JSON.stringify({rows:grid.rows,cols:grid.cols,cells:rows,inkColor:$('#inkColor').value},null,2)}
function exportGridJSON(){if(grid)downloadBlob(new Blob([gridJson()],{type:'application/json'}),'ink-grid.json')}
function exportGridPNG(){
 if(!grid)return;const c=document.createElement('canvas');c.width=grid.cols;c.height=grid.rows;const x=c.getContext('2d');x.fillStyle=grid.bg;x.fillRect(0,0,c.width,c.height);
 for(let i=0;i<grid.cells.length;i++)if(grid.cells[i]){x.fillStyle=grid.regions[i]?palette[(grid.regions[i]-1)%palette.length]:'#111';x.fillRect(i%grid.cols,(i/grid.cols)|0,1,1)}
 c.toBlob(b=>b&&downloadBlob(b,'ink-grid.png'),'image/png')
}
function setPalette(name){if(paletteSets[name])palette=paletteSets[name].slice();renderPalette()}
function renderPalette(){
 const holder=$('#palette');holder.innerHTML='';palette.forEach((color,i)=>{const input=document.createElement('input');input.type='color';input.value=color;input.className='swatch';input.title=`Palette color ${i+1}`;input.addEventListener('input',()=>{palette[i]=input.value});holder.append(input)})
}
function seedGrow(){
 if(!grid)return;const {cells,regions,locked,fade,rows,cols}=grid,n=cells.length;
 if(!growthStarted){
  if(!cells.some(v=>!v)){toast('No room to seed growth');return}
  let added=0,tries=0;while(added<Math.min(24,Math.floor(n/50))&&tries++<n*2){
   const idx=Math.floor(Math.random()*n);if(cells[idx])continue;const r=(idx/cols)|0,c=idx%cols;
   if(neighborCount(cells,rows,cols,r,c)>0)continue;cells[idx]=1;regions[idx]=1+Math.floor(Math.random()*palette.length);fade[idx]=1;added++
  }
  if(!added){toast('No open cells for colonies');return}
  growthStarted=true
 }
 renderGridCanvas();growthRunning=true;setStatus('GROWING');$('#growBtn').textContent='Ⅱ PAUSE GROWTH';let last=performance.now(),acc=0;
 const loop=now=>{if(!growthRunning)return;acc+=now-last;last=now;if(acc>=1000/+$('#growSpeed').value){acc=0;stepGrowth();renderGridCanvas();if(recording())drawRecordingFrame()}growthTimer=requestAnimationFrame(loop)};
 growthTimer=requestAnimationFrame(loop)
}
function neighborCount(a,rows,cols,r,c){
 let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const y=r+dy,x=c+dx;if(y>=0&&y<rows&&x>=0&&x<cols&&a[y*cols+x])n++}return n
}
function stepGrowth(){
 const g=grid,n=g.cells.length,ca=g.nextCells,ra=g.nextRegions,fa=g.nextFade,ag=g.nextAge,rule=$('#lifeRule').value==='B36/S23'?'36':'3';ca.fill(0);ra.fill(0);fa.fill(0);ag.fill(0);
 for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
  const i=r*g.cols+c;if(g.locked[i]){ca[i]=1;ra[i]=g.regions[i];fa[i]=1;continue}
  let count=0,n0=0,n1=0,n2=0,n3=0,n4=0,n5=0,n6=0,n7=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const y=r+dy,x=c+dx;if(y<0||y>=g.rows||x<0||x>=g.cols)continue;const ni=y*g.cols+x;if(g.cells[ni]){count++;if(g.regions[ni])switch((g.regions[ni]-1+palette.length)%palette.length){case 0:n0++;break;case 1:n1++;break;case 2:n2++;break;case 3:n3++;break;case 4:n4++;break;case 5:n5++;break;case 6:n6++;break;case 7:n7++}}}
  if(g.cells[i]?(count===2||count===3):((count===3)||(rule==='36'&&count===6))){
   ca[i]=1;let best=1,bestCount=n0;if(n1>bestCount){best=2;bestCount=n1}if(n2>bestCount){best=3;bestCount=n2}if(n3>bestCount){best=4;bestCount=n3}if(n4>bestCount){best=5;bestCount=n4}if(n5>bestCount){best=6;bestCount=n5}if(n6>bestCount){best=7;bestCount=n6}if(n7>bestCount){best=8}ra[i]=g.cells[i]?g.regions[i]:(best||1);fa[i]=1;ag[i]=g.age[i]+1
  }else{ra[i]=g.regions[i];fa[i]=Math.max(0,g.fade[i]-(g.cells[i]?+$('#ghostFade').value/100:0));ag[i]=g.age[i]+1}
 }
 g.nextCells=g.cells;g.nextRegions=g.regions;g.nextFade=g.fade;g.nextAge=g.age;g.cells=ca;g.regions=ra;g.fade=fa;g.age=ag
}
function stopGrowth(){growthRunning=false;cancelAnimationFrame(growthTimer);$('#growBtn').textContent='▶ GROW';if(grid){renderGridCanvas();setStatus('GROWTH PAUSED')}}
function switchBack(){if(growthRunning)stopGrowth();viewTransition={from:'grid',start:performance.now()};stage.classList.remove('grid-view');setStatus(strokes.length?'DRAWING VIEW':'LOAD AN IMAGE TO BEGIN')}
function toggleView(){
 const was=stage.classList.contains('grid-view');if(was)switchBack();else if(grid){stage.classList.add('grid-view');renderGridCanvas();previousView='grid'}
}
function hideUI(){document.body.classList.toggle('hidden-ui');setTimeout(resizeCanvases,60)}
function toggleRecord(){if(recording())stopRecord();else startRecord()}
function bind(){
 $('#fileInput').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});
 document.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragover')});
 document.addEventListener('dragleave',e=>{if(e.relatedTarget===null)stage.classList.remove('dragover')});
 document.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)loadFile(f)});
 $('#startBtn').addEventListener('click',()=>running?stopDrawing():startDrawing());$('#stopBtn').addEventListener('click',stopDrawing);
 $('#clearBtn').addEventListener('click',clearDrawing);$('#hideBtn').addEventListener('click',hideUI);
 $('#recordBtn').addEventListener('click',toggleRecord);$('#recordTop').addEventListener('click',toggleRecord);
 $('#downloadVideo').addEventListener('click',()=>{if(recordChunks.length)downloadBlob(new Blob(recordChunks,{type:recordMime||'video/webm'}),'draw-bot-recording.'+(recordMime.includes('mp4')?'mp4':'webm'))});
 $('#exportDrawing').addEventListener('click',exportDrawing);$('#convertGrid').addEventListener('click',convertGrid);
 $('#exportGridJson').addEventListener('click',exportGridJSON);$('#exportGridPng').addEventListener('click',exportGridPNG);
 $('#copyGrid').addEventListener('click',async()=>{if(!grid)return;try{await navigator.clipboard.writeText(gridJson());toast('Grid JSON copied')}catch{toast('Clipboard access unavailable')}});
 $('#growBtn').addEventListener('click',()=>{if(growthRunning)stopGrowth();else seedGrow()});$('#backDraw').addEventListener('click',switchBack);
 $('#palettePreset').addEventListener('change',e=>setPalette(e.target.value));
 $('#inkPreset').addEventListener('change',e=>{if(e.target.value!=='custom')$('#inkColor').value=e.target.value});
 $('#penStyle').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;style=b.dataset.v;$('#penStyle').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});
 $('#ghostOn').addEventListener('change',renderGhost);$('#ghostRef').addEventListener('input',()=>{updateRangeOutputs();renderGhost()});
 const ranges=['smooth','detail','minLength','hatchSpacing','hatchDensity','lineWidth','speed','ghostRef','liftPause','threshold','ghostFade','growSpeed'];
 const traceRanges=['smooth','detail','minLength','hatchSpacing','hatchDensity'];
 ranges.forEach(id=>$('#'+id).addEventListener('input',()=>{updateRangeOutputs();if(id==='ghostRef')renderGhost();if(traceRanges.includes(id))scheduleAnalysis()}));
 $('#strokeOrder').addEventListener('change',scheduleAnalysis);$('#shading').addEventListener('change',scheduleAnalysis);
 window.addEventListener('resize',resizeCanvases);new ResizeObserver(resizeCanvases).observe(board);
 document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')&&e.key!=='Escape')return;
  if(e.key==='h'||e.key==='H'){hideUI();e.preventDefault()}else if(e.key==='Escape'){document.body.classList.remove('hidden-ui');setTimeout(resizeCanvases,60)}
  else if(e.code==='Space'){e.preventDefault();running?stopDrawing():startDrawing()}
  else if(e.key==='r'||e.key==='R'){redraw();if(strokes.length)startDrawing()}else if(e.key==='g'||e.key==='G'){if(grid){stage.classList.add('grid-view');growthRunning?stopGrowth():seedGrow()}}
  else if(e.key==='f'||e.key==='F')window.fastDraw=true
 });
 document.addEventListener('keyup',e=>{if(e.key==='f'||e.key==='F')window.fastDraw=false});
 window.addEventListener('blur',()=>window.fastDraw=false);
}
bind();renderPalette();updateRangeOutputs();resizeCanvases();
})();
</script>
